<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粮堆管理 · 粮仓集成监控中心</title>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/station-pages.css">
</head>
<body class="station-page" data-station-page="piles">
<header class="station-page-header">
  <a class="station-page-brand" href="/index.html"><span class="station-page-brand-mark"><img src="/assets/img/grain-mark.svg" alt=""></span><span><strong>粮仓集成监控中心</strong><small>GrainSilo · 本地数据中心</small></span></a>
  <nav class="station-page-nav" aria-label="主导航">
    <a data-page="overview" href="/index.html">仓库总览</a><a class="active" data-page="piles" href="/piles.html" aria-current="page">粮堆管理</a><a data-page="probes" href="/probes.html">探杆管理</a><a data-page="environment" href="/environment.html">环境监测</a><a data-page="alerts" href="/alerts.html">告警中心</a><a data-page="history" href="/db.html">历史数据库</a><a data-page="crop" href="/crop-models.html">作物模型</a>
  </nav>
  <span class="station-page-health" data-health>中心站连接中</span>
</header>
<main class="station-page-main">
  <div class="station-page-title-row">
    <div><span class="station-eyebrow">INVENTORY / PILE CONFIGURATION</span><h1>粮堆管理</h1><p>每个粮堆单独编号、登记库存并绑定探杆；只维护当前系统确实支持的字段。</p></div>
    <div class="station-toolbar"><button class="station-button" data-refresh>刷新数据</button></div>
  </div>
  <section class="station-stat-grid" aria-label="粮堆统计">
    <div class="station-stat"><b id="pileCount">—</b><span>粮堆数量</span></div>
    <div class="station-stat"><b id="pileVolume">—</b><span>登记估算总体积 m³</span></div>
    <div class="station-stat"><b id="pileWeight">—</b><span>登记总粮重 t</span></div>
    <div class="station-stat"><b id="pilePoleCount">—</b><span>已绑定探杆</span></div>
  </section>
  <div class="station-content-grid">
    <section class="station-card">
      <div class="station-card-head"><h2 id="pileFormTitle">新增粮堆</h2><button class="station-button" id="pileFormReset" type="button">清空</button></div>
      <form id="pileForm" class="station-form">
        <input id="pileId" type="hidden">
        <div class="station-form-grid">
          <label>粮堆名称<input id="pileName" required maxlength="40" placeholder="如：1号粮堆"></label>
          <label>入仓粮重（吨）<input id="pileWeightInput" type="number" min="0" step="0.1" value="0"></label>
          <label>登记容重（kg/m³）<input id="pileDensity" type="number" min="1" step="1" value="750"></label>
          <label data-pile-flat>平面长度（m）<input id="pileLength" type="number" min="0.5" step="0.1" value="8"></label>
          <label data-pile-flat>平面宽度（m）<input id="pileWidth" type="number" min="0.5" step="0.1" value="5"></label>
        </div>
        <label>绑定探杆（可多选）<select id="pilePoles" multiple aria-label="选择绑定探杆"></select></label>
        <div class="station-note warning" id="pileGeometryNote">系统按“登记粮重 ÷ 登记容重”估算体积；平房仓使用登记平面尺寸，圆筒仓使用仓房直径并采用参数化圆锥粮堆。几何为估算，不是现场测绘或 CFD；超出当前假设容量时会明确提示。</div>
        <div class="station-inline"><button class="station-button primary" type="submit">保存粮堆</button><span class="station-card-message" id="pileFormMessage" role="status"></span></div>
      </form>
    </section>
    <section class="station-card">
      <div class="station-card-head"><h2>粮堆档案</h2><span class="station-small" id="pileListMeta">读取中</span></div>
      <div class="station-list" id="pilesList"><div class="station-empty">正在读取粮堆档案…</div></div>
    </section>
  </div>
</main>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/station-pages.js"></script>
</body>
</html>
