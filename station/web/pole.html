<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探杆详情 - 粮仓集成监控中心</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<!-- 返回总览 -->
<div class="topbar">
  <div>
    <h1><a href="/" style="color:inherit">← 返回总览</a></h1>
    <div class="sub">单杆详情 · 曲线 / 告警 / 远程控制</div>
  </div>
  <div class="topbar-right">最后刷新 <span id="refreshTime">-</span></div>
</div>

<!-- 信息条 -->
<header class="pole-header" id="poleHeader">
  <span class="name" id="pName">加载中…</span>
  <span class="meta" id="pUid"></span>
  <span id="pBadge"></span>
  <span class="meta">电量 <span id="pBat">-</span></span>
  <span class="meta">最后上报 <span id="pLast">-</span></span>
  <span class="meta">3D 位置 (x, y, z) <span id="pPos">-</span></span>
  <span class="meta">节点间距 <span id="pSpacing">-</span></span>
</header>

<!-- 曲线卡片 -->
<section class="card chart-card">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2>温湿度曲线（每节点）</h2>
    <div class="chart-range">
      <button data-hours="24" class="active">24 小时</button>
      <button data-hours="168">7 天</button>
      <button data-hours="720">30 天</button>
    </div>
  </div>
  <div id="tempChart"></div>
</section>

<!-- 节点表 + 控制 -->
<div class="control-grid" style="margin:0 24px">

  <section class="card nodes-card">
    <h2>节点实时数据</h2>
    <table>
      <thead><tr><th>节点</th><th>深度</th><th>温度</th><th>湿度</th><th>状态</th></tr></thead>
      <tbody id="nodeTable"><tr><td colspan="5">加载中…</td></tr></tbody>
    </table>
  </section>

  <div>
    <section class="card">
      <h2>远程控制</h2>
      <p style="color:var(--dim);font-size:13px;margin-bottom:10px">
        指令经中心站缓存，杆子下次上报（最长 15 分钟）时随响应执行。
      </p>
      <button id="modeBtn" class="ghost">切换模式…</button>
      <span id="cmdMsg" style="color:var(--dim);font-size:12px;margin-left:10px"></span>
    </section>

    <section class="card">
      <h2>告警阈值（中心站二级告警）</h2>
      <label>温度高 ≥ <input id="thTempHigh" type="number" step="0.1" style="width:80px">°C</label>
      <label>温度低 ≤ <input id="thTempLow" type="number" step="0.1" style="width:80px">°C</label>
      <label>湿度高 ≥ <input id="thRhHigh" type="number" step="0.1" style="width:80px">%</label>
      <br><button id="thSave">保存阈值</button>
    </section>

    <section class="card">
      <h2>探杆档案（3D 部署配置）</h2>
      <label>名称 <input id="cName" style="width:150px"></label>
      <label>X <input id="cX" type="number" step="0.5" style="width:70px"></label>
      <label>Y <input id="cY" type="number" step="0.5" style="width:70px"></label>
      <label>Z <input id="cZ" type="number" step="0.5" style="width:70px"></label>
      <label>间距 <input id="cSpacing" type="number" step="0.1" style="width:70px">m</label>
      <br><button id="cfgSave">保存档案</button>
      <span style="color:var(--dim);font-size:12px;margin-left:10px">
        坐标/间距只存在中心站，改位置无需重烧固件
      </span>
    </section>
  </div>
</div>

<script src="/assets/vendor/echarts.min.js"></script>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/pole.js"></script>
</body>
</html>
